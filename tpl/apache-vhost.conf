<VirtualHost 127.0.0.1:18080>

ServerName {{ $domain }}
ServerAlias {{ $domains }}

ErrorLog /var/log/apache2/9-{{ $domain }}.error.log
CustomLog /var/log/apache2/9-{{ $domain }}.access.log combined env=!APCC_NO_LOG

DocumentRoot {{ $dir_run }}

# block hidden file, folder exclude .well-known
<Directory ~ "/\.(?!well-known\/)">
    Require all denied
</Directory>

#xsendfile_start
<IfModule mod_xsendfile.c>
    XSendFilePath {{ $apache_xsendfile_dir }}
</IfModule>
#xsendfile_end

#php_start
<FilesMatch "^(error_log|\.user\.ini)$">
    Require all denied
</FilesMatch>

<FilesMatch "\.(po|mo|phtml|cache|dat|scss)$">
    Require all denied
</FilesMatch>

<FilesMatch "^(composer\.json|composer\.lock)$">
    Require all denied
</FilesMatch>

<FilesMatch "^#.*#$">
    Require all denied
</FilesMatch>


<FilesMatch "\.php$">
    <If "-f %{REQUEST_FILENAME}">
        #SetEnvIfNoCase ^Authorization$ "(.+)" HTTP_AUTHORIZATION=$1

        ProxyFCGISetEnvIf "true" HTTPS on
        ProxyFCGISetEnvIf "true" SERVER_PORT 443
        ProxyFCGISetEnvIf "true" REQUEST_SCHEME https

        SetHandler "proxy:unix:/run/php/php{{ $mode_php }}-fpm-9-{{ $domain }}.sock|fcgi://localhost"
    </If>
</FilesMatch>

<FilesMatch "\.php(~)$">
    Require all denied
</FilesMatch>

<FilesMatch ".\.phps$">
    Require all denied
</FilesMatch>

<FilesMatch "^\.php[0-9]+$">
    Require all denied
</FilesMatch>

<FilesMatch "^\.ph(?:ar|p|ps|tml)$">
    Require all denied
</FilesMatch>
#php_end

</VirtualHost>
