# default

<VirtualHost 127.0.0.1:18080>
    ErrorLog /dev/null
    CustomLog /dev/null combined
</VirtualHost>

## panel

<VirtualHost 127.0.0.1:18081>
	DocumentRoot /miz_data/panel

    ErrorLog /var/log/apache2/0-admin.error.log
	CustomLog /dev/null combined


	<Location />
		AuthType Basic
		AuthName "Admin Panel"
		AuthUserFile /miz_data/.htpasswd
		Require valid-user
	</Location>

	
	<Directory /miz_data/panel>
		Options -MultiViews -Indexes +FollowSymLinks
		AllowOverride All
		Require all granted

        <FilesMatch "\.php$">
		    <If "-f %{REQUEST_FILENAME}">
		        ProxyFCGISetEnvIf "true" HTTPS on
                ProxyFCGISetEnvIf "true" SERVER_PORT 443
                ProxyFCGISetEnvIf "true" REQUEST_SCHEME https
    
			    SetHandler "proxy:unix:/run/php/php-fpm-0-admin.sock|fcgi://localhost"
		    </If>
	    </FilesMatch>
    </Directory>


    Alias /log-html/ /var/log/apache2_stats/

	<Directory /var/log/apache2_stats/>
		Options -MultiViews +Indexes +FollowSymLinks
		AllowOverride None
		Require all granted
	</Directory>


    ProxyPass /server-stats http://127.0.0.1:19866/stats
    ProxyPass /file-manager-root/ http://127.0.0.1:12088/


    # ===== www =====
    Alias /file-manager/ /miz_data/app/file-manager/
    Alias /phpmyadmin/ /miz_data/app/phpmyadmin/

    <Directory /miz_data/app>
        Options +Indexes +FollowSymLinks -MultiViews
        AllowOverride All

        <FilesMatch "\.php$">
            <If "-f %{REQUEST_FILENAME}">
                ProxyFCGISetEnvIf "true" HTTPS on
                ProxyFCGISetEnvIf "true" SERVER_PORT 443
                ProxyFCGISetEnvIf "true" REQUEST_SCHEME https

                ProxyFCGISetEnvIf "true" FILE_MANAGER_PHP_AUTO_LOGIN on

                SetHandler "proxy:unix:/run/php/php8.3-fpm-0-www.sock|fcgi://localhost"
            </If>
        </FilesMatch>
    </Directory>
    # ===== www =====


</VirtualHost>
