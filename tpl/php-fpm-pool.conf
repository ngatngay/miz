[{{ $mode_php }} {{ $domain }}]

user = www
group = www
clear_env = yes

listen = /run/php/php{{ $mode_php }}-fpm-9-{{ $domain }}.sock
listen.owner = www
listen.group = www-data
listen.mode = 0660

listen.backlog = 24
listen.allowed_clients = 127.0.0.1

pm = ondemand
pm.max_requests = 6000
pm.status_path = /php_fpm_status
pm.max_children = 8
pm.process_idle_timeout = 60s

; only use max_execution_time
request_terminate_timeout = 0

php_admin_value[open_basedir] = /tmp:{{ $dir }}
php_admin_value[error_log] = {{ $dir }}/error_log
php_admin_value[log_errors] = On
php_admin_value[disable_functions] = eval

; custom code after here
