ServerName localhost
ServerAdmin admin@localhost

LogLevel error
LogLevel authz_core:crit
LogLevel autoindex:crit

ErrorLog /var/log/apache2/0-error.log

ServerTokens Prod
ServerSignature Off
TraceEnable Off

FileETag None
Header always unset ETag

Header always unset X-Powered-By

Protocols http/1.1
ProtocolsHonorOrder On
RemoteIPHeader X-Forwarded-For

#
EnableMMAP Off
EnableSendfile On
HostnameLookups Off

KeepAlive On
MaxKeepAliveRequests 0
KeepAliveTimeout 1000

Timeout 600
LimitRequestFieldSize 65536
LimitRequestLine 65536
LimitRequestBody 1024000000
#RequestReadTimeout handshake=0 header=20-40,MinRate=500 body=20,MinRate=500

## gzip
DeflateCompressionLevel 1
DeflateWindowSize 15
DeflateMemLevel 9
DeflateBufferSize 8096


## Cache
ExpiresActive On
#ExpiresDefault "access plus 1 years"

# No cache
ExpiresByType text/html "access plus 0 seconds"
ExpiresByType application/json "access plus 0 seconds"
ExpiresByType application/ld+json "access plus 0 seconds"
ExpiresByType application/xml "access plus 0 seconds"
ExpiresByType text/xml "access plus 0 seconds"
ExpiresByType application/x-web-app-manifest+json "access plus 0 seconds"
ExpiresByType text/cache-manifest "access plus 0 seconds"

# Short cache
ExpiresByType application/atom+xml "access plus 1 hours"
ExpiresByType application/rss+xml "access plus 1 hours"

# Static
ExpiresByType image/* "access plus 1 years"
ExpiresByType video/* "access plus 1 years"
ExpiresByType font/* "access plus 1 years"
ExpiresByType application/vnd.ms-fontobject "access plus 1 years"

ExpiresByType text/css "access plus 1 years"
ExpiresByType text/javascript "access plus 1 years"
ExpiresByType application/javascript "access plus 1 years"


# no log
SetEnvIfNoCase Request_URI "/socket\.io/" APCC_NO_LOG
SetEnvIfNoCase Request_URI "^/robots\.txt$" APCC_NO_LOG
SetEnvIfNoCase Request_URI "^/favicon\.ico$" APCC_NO_LOG

# no log image
SetEnvIfNoCase Request_URI "\.(jpg|jpeg|png|gif|webp|svg|avif)$" APCC_NO_LOG

AddDefaultCharset UTF-8
DefaultType none

DocumentRoot /var/www/html
DirectoryIndex index.html index.htm index.php

# main document
<Directory /home/>
    Options -Indexes -MultiViews +FollowSymLinks
    AllowOverride All
    CGIPassAuth On

    Require all granted
</Directory>

