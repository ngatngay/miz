global
    # 3.2 and up
    
    # upload speed
    # tune.h2.fe.rxbuf 1600k

    chroot /var/lib/haproxy

    log /dev/log local0
    log /dev/log local1 notice

    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s

    user haproxy
    group haproxy

    daemon

    # https://ssl-config.mozilla.org/#server=haproxy&version=3.2&config=intermediate&openssl=3.0.13&guideline=5.7
    ssl-default-bind-curves X25519:prime256v1:secp384r1
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-options prefer-client-ciphers ssl-min-ver TLSv1.2 no-tls-tickets

defaults
    mode http
    balance roundrobin

    no log

    timeout connect 20s

    timeout client 600s
    timeout server 600s

    errorfile 400 /etc/haproxy/errors/400.http
    errorfile 403 /etc/haproxy/errors/403.http
    errorfile 408 /etc/haproxy/errors/408.http
    errorfile 500 /etc/haproxy/errors/500.http
    errorfile 502 /etc/haproxy/errors/502.http
    errorfile 503 /etc/haproxy/errors/503.http
    errorfile 504 /etc/haproxy/errors/504.http

## miz

frontend miz_http
    bind :80
    mode http

    # auto acme
    acl is_acme_challenge path_beg /.well-known/acme-challenge/
    http-request redirect scheme https if !is_acme_challenge
    
    http-request set-header X-Forwarded-Proto http
    
    use_backend miz_backend_acme if is_acme_challenge

frontend miz_https
    bind :443 ssl crt /var/lib/haproxy/cert/ alpn h2,http/1.1
    mode http

    # builtin acl
    acl is_http2 req.ver 2.0
    acl is_grpc hdr(content-type) -m beg application/grpc
    acl is_ajax hdr(X-Requested-With) -i XMLHttpRequest

    #keep alive
    option http-keep-alive
    timeout http-keep-alive 30s#miz_fe

    http-request set-header X-Forwarded-Proto https


#miz_generator


## miz builtin

frontend miz_frontend_admin
    bind :2087 ssl crt /var/lib/haproxy/cert/0.pem alpn h2,http/1.1
    mode http

    #block spam
    acl is_banned_cf req.hdr_ip(CF-Connecting-IP),in_table(miz_stbl_fail2ban_ips)
    acl is_banned_direct src,in_table(miz_stbl_fail2ban_ips)
    http-request deny deny_status 403 if is_banned_cf || is_banned_direct
    
    use_backend miz_backend_admin

frontend miz_frontend_admin_stats
    bind 127.0.0.1:19866 alpn http/1.1
    mode http

    stats enable
    stats uri /stats
    stats hide-version


backend miz_backend_admin
    mode http
    option forwardfor except 127.0.0.1
    server proxy 127.0.0.1:18081 alpn http/1.1

backend miz_backend_acme
    mode http
    option forwardfor except 127.0.0.1
    server proxy 127.0.0.1:18082 alpn http/1.1

backend miz_stbl_fail2ban_ips
    stick-table type string len 64 size 1m expire 1h
