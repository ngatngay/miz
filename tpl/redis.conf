## bind

bind 127.0.0.1
port 6379
protected-mode yes

## bind for socket
# port 0
# unixsocket /run/redis/redis.sock
# unixsocketperm 777

## memory

maxmemory-policy allkeys-lru
maxmemory-samples 5

## connect

maxclients $M_maxclients
databases 1

tcp-backlog $M_backlog
timeout 0
tcp-keepalive 300

## process

daemonize no
supervised auto

## loging

loglevel warning
logfile /var/log/valkey/valkey-server.log

slowlog-log-slower-than 1000000
slowlog-max-len 128

## pure cache

save ""
stop-writes-on-bgsave-error no

cluster-enabled no

appendonly no
appendfsync no
