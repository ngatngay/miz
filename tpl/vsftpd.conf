listen=YES
listen_ipv6=NO
connect_from_port_20=YES

anonymous_enable=NO
local_enable=YES

use_localtime=YES
local_umask=022
write_enable=YES

# log
xferlog_enable=NO
dirmessage_enable=YES

# secure
secure_chroot_dir=/var/run/vsftpd/empty
pam_service_name=vsftpd
seccomp_sandbox=NO

pasv_enable=NO

force_dot_files=YES
chroot_local_user=YES
allow_writeable_chroot=YES

guest_enable=YES
guest_username=www
virtual_use_local_privs=YES
user_config_dir=/etc/vsftpd/virt_users.d
